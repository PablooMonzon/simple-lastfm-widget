<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple LastFM Widget</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        #lastfm-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        #lastfm-cover {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            height: auto;
        }

        #lastfm-song {
            margin-top: 10px;
            font-size: 1.5em;
            text-align: center;
            font-weight: bold;
            word-wrap: break-word;
        }

        #lastfm-album,
        #lastfm-artist {
            margin-top: 5px;
            font-size: 1em;
            text-align: center;
            word-wrap: break-word;
        }

        /* Tema claro */
        @media (prefers-color-scheme: light) {
            body {
                background-color: #ffffff;
                color: #000000;
            }
        }

        /* Tema oscuro */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: rgb(25 25 25);
                color: #ffffff;
            }
        }

        /* Responsividad */
        @media (max-width: 768px) {
            #lastfm-song {
                font-size: 1.2em;
            }

            #lastfm-album,
            #lastfm-artist {
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            #lastfm-song {
                font-size: 1em;
            }

            #lastfm-album,
            #lastfm-artist {
                font-size: 0.8em;
            }
        }
    </style>
</head>

<body>
    <div id="lastfm-widget">
        <!-- <span id="lastfm-scrobbling-date"></span> -->
        <img id="lastfm-cover" src="" alt="Cover Art" style="width: 150px; height: auto;">
        <span id="lastfm-song">Cargando última canción...</span>
        <span id="lastfm-artist"></span>
    </div>


    <script>
        function GetURLParameter(sParam) {
            var sPageURL = window.location.search.substring(1);
            var sURLVariables = sPageURL.split('&');
            for (var i = 0; i < sURLVariables.length; i++) {
                var sParameterName = sURLVariables[i].split('=');
                if (sParameterName[0] == sParam) {
                    return sParameterName[1];
                }
            }
        }
        const apiKey = GetURLParameter('api_key'); //'c11e6d873aa482319c0e470bae783311';
        const username = GetURLParameter('username'); //'Monzon_Pablo';
        const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${username}&api_key=${apiKey}&format=json`;

        if (!apiKey || !username) {
            document.getElementById('lastfm-song').textContent = 'Error: API Key o Username no proporcionados.';
        } else {
            function fetchLastFMData() {
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        const track = data.recenttracks.track[0];
                        const songName = track.name;
                        const artistName = track.artist['#text'];
                        const coverArt = track.image[2]['#text']; // Medium size image
                        // const albumName = track.album['#text'];
                        // const isNowPlaying = track['@attr'] && track['@attr'].nowplaying ? 'Escuchando ahora' : '';
                        // if (isNowPlaying) {
                        //     document.getElementById('lastfm-scrobbling-date').classList.add('now-playing');
                        //     document.getElementById('lastfm-scrobbling-date').textContent = `${isNowPlaying}`;
                        //     // Add class
                        // } else {
                        //     const timeScrobbled = track.date ? new Date(track.date['#text']) : new Date();
                        //     const formattedTime = timeScrobbled.toLocaleString('es-ES', {
                        //         year: 'numeric',
                        //         month: '2-digit',
                        //         day: '2-digit',
                        //         hour: '2-digit',
                        //         minute: '2-digit',
                        //         second: '2-digit'
                        //     });
                        //     document.getElementById('lastfm-scrobbling-date').classList.remove('now-playing');
                        //     document.getElementById('lastfm-scrobbling-date').classList.add('last-scrobbled');
                        //     document.getElementById('lastfm-scrobbling-date').textContent = `Escuchado el ${formattedTime}`;
                        // }
                        // document.getElementById('lastfm-time-scrobbled').textContent = `${formattedTime}`;
                        document.getElementById('lastfm-song').textContent = `${songName}`;
                        document.getElementById('lastfm-artist').textContent = `${artistName}`;
                        document.getElementById('lastfm-cover').src = coverArt || 'default-image.jpg';
                    })
                    .catch(error => {
                        console.error('Error fetching LastFM data:', error);
                        document.getElementById('lastfm-song').textContent = 'Error al cargar la canción.';
                    });
            }

            fetchLastFMData();
            setInterval(fetchLastFMData, 30000); // Reiterar cada 30 segundos

        }
    </script>
</body>

</html>
